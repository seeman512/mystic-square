name: Mystic Square check

# This workflow is kept at the repository root as the canonical check definition.
# Copy it to .github/workflows/theme8-check.yml to enable it in GitHub Actions.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystic-square-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Format, vet, build, and test
        run: |
          set -euo pipefail
          files=$(git ls-files '*.go')
          test -z "$(gofmt -l $files)"
          go vet ./...
          go build ./...
          go test ./... -race -count=1

      - name: Check repository structure and migrations
        run: |
          set -euo pipefail
          test ! -e .env || { echo '.env must not be committed'; exit 1; }
          grep -qxF '.env' .gitignore
          grep -q '^DATABASE_URL=' .env.example || {
            echo '.env.example must document DATABASE_URL'
            exit 1
          }
          test -z "$(find . -maxdepth 1 -name '*.go' -print)"
          test -f cmd/api/main.go
          test -f internal/app/app.go
          test -f internal/handler/level.go
          test -f internal/handler/user.go
          test -f internal/handler/game.go
          test -f internal/model/level.go
          test -f internal/model/user.go
          test -f internal/model/game.go
          test -f internal/repository/db.go
          test -f internal/repository/user.go
          test -f internal/repository/game.go
          test -f internal/service/level.go
          test -f internal/service/user.go
          test -f internal/service/game.go
          test -f migrations/000001_create_levels.up.sql
          test -f migrations/000001_create_levels.down.sql
          test -f migrations/000002_create_users_and_games.up.sql
          test -f migrations/000002_create_users_and_games.down.sql
          grep -q '^module mystic-square$' go.mod
          grep -q 'gorm.io/gorm' go.mod
          grep -q 'gorm.io/driver/postgres' go.mod
          grep -q 'github.com/gin-gonic/gin' go.mod
          ! grep -R --include='*.go' -n 'AutoMigrate' .
          for migration in migrations/*.up.sql; do
            test -f "${migration%.up.sql}.down.sql"
          done
          docker compose config -q

  integration:
    name: PostgreSQL migrations and API
    needs: static
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mystic
          POSTGRES_PASSWORD: mystic
          POSTGRES_DB: mystic_square
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mystic -d mystic_square"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mystic:mystic@localhost:5432/mystic_square?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Install migration tool
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Apply and reverse migrations
        run: |
          set -euo pipefail
          migrate -path migrations -database "$DATABASE_URL" up
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('levels','users','games')" \
            | grep -qx 3
          migrate -path migrations -database "$DATABASE_URL" down -all
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Run tests with the race detector
        run: go test ./... -race -count=1

      - name: API smoke test
        run: |
          set -euo pipefail
          go build -o bin/api ./cmd/api
          PORT=8080 DATABASE_URL="$DATABASE_URL" ./bin/api > app.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          test "$code" = 200
          test "$(curl -s http://localhost:8080/health | jq -r .status)" = ok
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/swagger/index.html)" = 200

          curl -s -D headers.txt -o /dev/null -X OPTIONS \
            -H 'Origin: http://example.com' \
            -H 'Access-Control-Request-Method: POST' \
            http://localhost:8080/api/v1/users
          grep -qi '^access-control-allow-origin:' headers.txt

          user_code=$(curl -s -o user.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/users)
          test "$user_code" = 201
          user_id=$(jq -r .id user.json)
          test "$user_id" -gt 0
          test "$(curl -s http://localhost:8080/api/v1/users | jq 'length')" -ge 1

          level_code=$(curl -s -o level.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"title":"Smoke","theme":"classic","objective":"solve","difficulty":"medium","rows":3,"columns":3}' \
            http://localhost:8080/api/v1/levels)
          test "$level_code" = 201
          level_id=$(jq -r .id level.json)

          game_code=$(curl -s -o game.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"level_id\":$level_id,\"user_id\":$user_id}" \
            http://localhost:8080/api/v1/games)
          test "$game_code" = 201
          game_id=$(jq -r .id game.json)
          test "$(jq '.init | length' game.json)" = 9
          test "$(jq '.board | length' game.json)" = 9
          test "$(jq '.moves | length' game.json)" = 0

          zero=$(jq '.board | index(0)' game.json)
          if [ $((zero % 3)) -gt 0 ]; then tile=$((zero - 1)); else tile=$((zero + 1)); fi
          row=$((tile / 3)); column=$((tile % 3))
          move_code=$(curl -s -o moved.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"row\":$row,\"column\":$column}" \
            "http://localhost:8080/api/v1/games/$game_id/move")
          test "$move_code" = 200
          test "$(jq '.moves | length' moved.json)" = 1
          test "$(curl -s http://localhost:8080/api/v1/games | jq 'length')" = 1

      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mystic-square-api-log
          path: app.log
          if-no-files-found: ignore
