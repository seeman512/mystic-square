{{define "header"}}
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">Mystic Square</a>
            <div class="navbar-nav ms-auto flex-row flex-wrap align-items-center justify-content-end gap-1">
                {{if .Authenticated}}
                <a class="nav-link{{if .IsGame}} active{{end}}" href="/game"{{if .IsGame}} aria-current="page"{{end}}>Game</a>
                {{if .IsAdmin}}
                <a class="nav-link{{if .IsLevels}} active{{end}}" href="/levels"{{if .IsLevels}} aria-current="page"{{end}}>Levels</a>
                <a class="nav-link{{if .IsUsers}} active{{end}}" href="/users"{{if .IsUsers}} aria-current="page"{{end}}>Users</a>
                {{end}}
                <form method="post" action="/logout" class="d-inline ms-2 mt-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
                {{else}}
                <a class="nav-link{{if .IsLogin}} active{{end}}" href="/login"{{if .IsLogin}} aria-current="page"{{end}}>Login</a>
                <a class="nav-link{{if .IsRegister}} active{{end}}" href="/register"{{if .IsRegister}} aria-current="page"{{end}}>Register</a>
                {{end}}
            </div>
        </div>
    </nav>
</header>
{{end}}
