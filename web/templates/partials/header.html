{{define "header"}}
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" aria-label="Main navigation">
        <div class="container">
            {{if .Authenticated}}
            <a class="navbar-brand fw-semibold" href="/game">Mystic Square</a>
            {{else}}
            <a class="navbar-brand fw-semibold" href="/login">Mystic Square</a>
            {{end}}
            <div class="navbar-nav ms-auto align-items-lg-center">
                {{if .Authenticated}}
                <a class="nav-link{{if .IsGame}} active{{end}}" href="/game"{{if .IsGame}} aria-current="page"{{end}}>Game</a>
                <form method="post" action="/logout" class="d-inline ms-lg-3 mt-2 mt-lg-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
                {{else}}
                <a class="nav-link{{if .IsLogin}} active{{end}}" href="/login"{{if .IsLogin}} aria-current="page"{{end}}>Login</a>
                <a class="nav-link{{if .IsRegister}} active{{end}}" href="/register"{{if .IsRegister}} aria-current="page"{{end}}>Register</a>
                {{end}}
            </div>
        </div>
    </nav>
</header>
{{end}}
