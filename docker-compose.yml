services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mystic_square
      POSTGRES_USER: mystic
      POSTGRES_PASSWORD: mystic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mystic -d mystic_square"]
      interval: 5s
      timeout: 3s
      retries: 10
