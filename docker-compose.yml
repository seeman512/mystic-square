services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mystic_square}
      POSTGRES_USER: ${POSTGRES_USER:-mystic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mystic}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-mystic}:${POSTGRES_PASSWORD:-mystic}@postgres:5432/${POSTGRES_DB:-mystic_square}?sslmode=disable
      - up

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mystic}:${POSTGRES_PASSWORD:-mystic}@postgres:5432/${POSTGRES_DB:-mystic_square}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
