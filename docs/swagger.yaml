basePath: /api/v1
definitions:
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    type: object
  handler.authResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  handler.createGameRequest:
    properties:
      level_id:
        type: integer
    type: object
  handler.levelAPIError:
    properties:
      code:
        type: string
      fields:
        items:
          $ref: '#/definitions/model.FieldError'
        type: array
      message:
        type: string
    type: object
  handler.levelErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handler.levelAPIError'
    type: object
  handler.moveRequest:
    properties:
      column:
        type: integer
      move:
        items:
          type: integer
        type: array
      row:
        type: integer
    type: object
  handler.updateUserRoleRequest:
    properties:
      role:
        $ref: '#/definitions/model.UserRole'
    type: object
  model.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  model.Difficulty:
    enum:
    - low
    - medium
    - hard
    type: string
    x-enum-varnames:
    - DifficultyLow
    - DifficultyMedium
    - DifficultyHard
  model.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/model.APIError'
    type: object
  model.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  model.Game:
    properties:
      board:
        description: Board is the current derived position. It is not persisted; Init
          and Moves are the source of truth.
        items:
          type: integer
        type: array
      id:
        example: 1
        type: integer
      init:
        items:
          type: integer
        type: array
      is_win:
        example: false
        type: boolean
      level:
        $ref: '#/definitions/model.Level'
      level_id:
        example: 1
        type: integer
      moves:
        items:
          items:
            type: integer
          type: array
        type: array
      user:
        $ref: '#/definitions/model.User'
      user_id:
        example: 1
        type: integer
    type: object
  model.Level:
    properties:
      columns:
        example: 4
        maximum: 100
        minimum: 2
        type: integer
      created_at:
        type: string
      description:
        example: A temple hidden in the jungle.
        type: string
      difficulty:
        allOf:
        - $ref: '#/definitions/model.Difficulty'
        enum:
        - low
        - medium
        - hard
        example: medium
      id:
        example: 1
        type: integer
      move_limit:
        example: 50
        maximum: 10000
        minimum: -1
        type: integer
      objective:
        description: Objective describes what the player must accomplish to complete
          the level.
        example: solve the puzzle
        type: string
      rows:
        example: 4
        maximum: 100
        minimum: 2
        type: integer
      theme:
        description: Theme describes the level's setting, such as a temple, forest,
          or space station.
        example: temple
        type: string
      time_limit:
        example: 300
        maximum: 3600
        minimum: -1
        type: integer
      title:
        example: Ancient Temple
        type: string
      updated_at:
        type: string
    type: object
  model.LevelInput:
    properties:
      columns:
        example: 4
        maximum: 100
        minimum: 2
        type: integer
      description:
        example: A temple hidden in the jungle.
        type: string
      difficulty:
        allOf:
        - $ref: '#/definitions/model.Difficulty'
        enum:
        - low
        - medium
        - hard
        example: medium
      move_limit:
        example: 50
        maximum: 10000
        minimum: -1
        type: integer
      objective:
        example: solve the puzzle
        type: string
      rows:
        example: 4
        maximum: 100
        minimum: 2
        type: integer
      theme:
        example: temple
        type: string
      time_limit:
        example: 300
        maximum: 3600
        minimum: -1
        type: integer
      title:
        example: Ancient Temple
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        example: ada@example.com
        type: string
      full_name:
        example: Ada Lovelace
        type: string
      id:
        example: 1
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        example: user
      updated_at:
        type: string
    type: object
  model.UserRole:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleUser
host: localhost:8080
info:
  contact: {}
  description: HTTP API for Mystic Square levels, users, and sliding-puzzle games.
  title: Mystic Square API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.authResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.authResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Register a user
      tags:
      - auth
  /games:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Game'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List games
      tags:
      - games
    post:
      consumes:
      - application/json
      parameters:
      - description: Game selection
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.createGameRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Game'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a game
      tags:
      - games
  /games/{id}:
    get:
      parameters:
      - description: Game ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a game
      tags:
      - games
  /games/{id}/move:
    post:
      consumes:
      - application/json
      description: Coordinates are zero-based and must select a tile adjacent to the
        empty cell.
      parameters:
      - description: Game ID
        in: path
        name: id
        required: true
        type: integer
      - description: Move coordinates
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.moveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Apply a move
      tags:
      - games
  /games/{id}/moves:
    post:
      consumes:
      - application/json
      description: Coordinates are zero-based and must select a tile adjacent to the
        empty cell.
      parameters:
      - description: Game ID
        in: path
        name: id
        required: true
        type: integer
      - description: Move coordinates
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.moveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Apply a move
      tags:
      - games
  /levels:
    get:
      description: Returns levels, optionally filtered by difficulty and paginated.
      parameters:
      - default: 1
        description: Page number, starting at 1
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size, capped at 100
        in: query
        name: limit
        type: integer
      - description: Filter by difficulty
        enum:
        - low
        - medium
        - hard
        in: query
        name: difficulty
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Level'
            type: array
        "400":
          description: Invalid pagination parameters
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: List levels
      tags:
      - levels
    post:
      consumes:
      - application/json
      description: Creates a new puzzle level. Omitted grid dimensions default to
        4x4.
      parameters:
      - description: Level payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.LevelInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Level'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Invalid level payload
          schema:
            $ref: '#/definitions/handler.levelErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a level
      tags:
      - levels
  /levels/{id}:
    delete:
      description: Deletes the level with the given ID.
      parameters:
      - description: Level ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No content
        "400":
          description: Invalid level ID
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Level not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a level
      tags:
      - levels
    get:
      description: Returns the level with the given ID.
      parameters:
      - description: Level ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Level'
        "400":
          description: Invalid level ID
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Level not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Get a level
      tags:
      - levels
    put:
      consumes:
      - application/json
      description: Replaces the level with the given ID. Omitted grid dimensions default
        to 4x4.
      parameters:
      - description: Level ID
        in: path
        name: id
        required: true
        type: integer
      - description: Level payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/model.LevelInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Level'
        "400":
          description: Invalid level ID
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Level not found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Invalid level payload
          schema:
            $ref: '#/definitions/handler.levelErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace a level
      tags:
      - levels
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /users/{id}/role:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role update
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.updateUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a user's role
      tags:
      - users
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by a JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
